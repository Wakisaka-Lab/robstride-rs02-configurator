[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rs02-configurator"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["PySide6==6.8.3", "python-can==4.6.1", "gs-usb==0.3.0", "numpy==2.2.6", "tqdm==4.67.1", "libusb-package==1.0.26.3"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-qt==4.5.0", "ruff==0.14.0", "mypy==1.18.2", "pyinstaller==6.16.0"]
[project.scripts]
rs02-configurator = "gui.app:main"
[tool.setuptools]
package-dir = {"" = "src", "robstride_dynamics" = "vendor/robstride_dynamics"}
packages = ["gui", "service", "transport", "protocol", "robstride_dynamics"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"vendor/**" = ["ALL"]
[tool.mypy]
python_version = "3.11"
files = ["src", "hardware_smoke_test.py"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
robstride_dynamics = ["LICENSE"]
